
name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build_art:
    runs-on: ubuntu-latest
    env:
      # Change this to your actual GitHub username!
      GH_PROFILE_USER: "YOUR_GITHUB_USERNAME_HERE"
      
      # Personalizes the 3D Wordmark script
      WORDMARK_TEXT: "PARTH"
      WORDMARK_FONT: "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
      WORDMARK_FONT_INDEX: "0"

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install system fonts
        run: sudo apt-get install fonts-dejavu

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      
      # Generate the static art (Photo & Wordmark)
      - run: python scripts/prep_photo.py source-photo.jpg
      - run: python scripts/make_ascii_svg.py
      - run: python scripts/make_wordmark_svg.py
      
      # Generate the live data art (Heatmap & Streak)
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/generate_streak_svg.py $GH_PROFILE_USER streak.svg
      
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate automated profile art [skip ci]"
          file_pattern: "*.svg *.png scripts/contrib.json data/contributions.json"